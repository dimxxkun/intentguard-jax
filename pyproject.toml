[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard-jax"
version = "0.1.0"
description = "Train, calibrate, and serve a Flax Transformer with explicit out-of-scope rejection"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Sanusi Abdulfatai Oyewunmi"}]
dependencies = ["jax>=0.8,<1", "flax>=0.12,<1", "optax>=0.2,<1", "transformers>=5,<6", "tokenizers>=0.22,<1", "scikit-learn>=1.7,<2", "numpy>=2,<3", "scipy>=1.15,<2", "safetensors>=0.6,<1", "fastapi>=0.120,<1", "uvicorn>=0.38,<1", "psutil>=7,<8", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.14"]

[project.scripts]
intentguard = "intentguard.cli:main"

[project.urls]
Repository = "https://github.com/dimxxkun/intentguard-jax"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
